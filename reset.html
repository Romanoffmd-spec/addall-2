<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>AddAll 2.0: очистка данных</title>
<style>body{font-family:Segoe UI,Arial,sans-serif;background:#f4f6fb;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.b{background:#fff;border-radius:12px;box-shadow:0 4px 24px #0001;padding:32px;max-width:460px}h1{margin:0 0 12px;font-size:22px}p{color:#444;line-height:1.5}
button{font-size:16px;padding:10px 18px;border-radius:8px;border:0;cursor:pointer;margin-right:8px}.d{background:#c0392b;color:#fff}.c{background:#e7eaf2}#st{margin-top:14px;font-weight:600}</style></head>
<body><div class="b"><h1>Очистить AddAll 2.0</h1>
<p>Будут удалены все данные в этом браузере: сотрудники, пациенты, регистры, события, анкеты, журналы, настройки и учебная база. Восстановить их нельзя, если нет резервной копии.</p>
<p>После очистки откроется первичная настройка, как при первом запуске.</p>
<button class="d" id="go">Удалить всё</button><button class="c" onclick="location.href='index.html'">Отмена</button><div id="st"></div></div>
<script>
const tmo = (p, ms, v) => Promise.race([p, new Promise(r => setTimeout(() => r(v), ms))]);
const del = n => tmo(new Promise(r => { const q = indexedDB.deleteDatabase(n); q.onsuccess = q.onerror = () => r('ok'); }), 6000, 'blocked');
document.getElementById('go').onclick = async () => {
  const st = document.getElementById('st'); st.textContent = 'Удаляю…';
  let names = ['addall2', 'addall2_train'];
  try { if (indexedDB.databases) names = [...new Set(names.concat((await tmo(indexedDB.databases(), 1500, [])).map(d => d.name).filter(n => /^addall/i.test(n))))]; } catch (e) {}
  const res = await Promise.all(names.map(del));
  try { Object.keys(localStorage).filter(k => /^addall/i.test(k)).forEach(k => localStorage.removeItem(k)); Object.keys(sessionStorage).filter(k => /^addall/i.test(k)).forEach(k => sessionStorage.removeItem(k)); } catch (e) {}
  if (res.includes('blocked')) { st.innerHTML = 'Базу держит другая открытая вкладка или окно с AddAll. Закройте их (или полностью закройте Chrome и откройте только эту страницу) и нажмите ещё раз.'; return; }
  st.textContent = 'Готово. Открываю AddAll…'; setTimeout(() => location.href = 'index.html', 900);
};
</script></body></html>
